releaseName: Fraia 0.0.15
releaseNotes: "### Added\r

  \r

  - New blank models now open immediately as untitled projects in Fraia-managed recovery storage.\r

  - Save and Save As create one dedicated, inspectable project folder on macOS, Windows, and Linux.\r

  - The File menu now provides Save and Save As with standard cross-platform keyboard shortcuts.\r

  \r

  ### Changed\r

  \r

  - Release jobs now build each native sidecar once, reuse reviewed renderer and sidecar artefacts, and split large application assets from updater-feed signing transfers.\r

  \r

  ### Fixed\r

  \r

  - Creating a blank model no longer asks the user to select an existing folder or places Fraia files beside unrelated files.\r

  - Saving releases the Rust-owned SQLite workspace before moving project data, so the folder workflow remains safe on Windows.\r

  \r

  ### Updating\r

  \r

  - Stable and Beta installations update to separately packaged `0.0.15` application identities on their existing channels."
