releaseName: Fraia 0.0.10
releaseNotes: "### Changed\r

  \r

  - Viewport labels now retain their semantic colours, resolve collisions more\r

  \  reliably, expand independently, and keep proposed-support labels anchored to\r

  \  their passive green support markers. Compact member labels show `SW` on its\r

  \  own line, while expanded labels show `Self weight` without separate arrows.\r

  - Selection now prioritises nodes and members over overlapping load graphics,\r

  \  uses restrained amber geometry-only highlights, clears predictably on an\r

  \  empty click, and supports containment, crossing, and lasso selection without\r

  \  making proposed supports selectable.\r

  - The canvas has a persistent Controls bar with accurate mouse diagrams,\r

  \  right- and left-handed help, authentic engineering-app navigation profiles,\r

  \  and a separate persistent Custom mouse profile. Fraia continues to default\r

  \  to SPACE GASS navigation.\r

  - New files open in an isometric view and remember their camera independently\r

  \  after the user moves it.\r

  - New assistant replies remain positioned at the top of the latest response,\r

  \  and the Base Model handoff into Design Options is clearer and more compact.\r

  - ChatGPT sign-in now uses browser authorization directly without asking users\r

  \  to paste a redirect URL.\r

  - Development launches now use one identifiable, single-owner Fraia Dev\r

  \  process with isolated user data and reliable stale-launch recovery.\r

  - The update dialog now presents release readiness and release notes more\r

  \  directly with less redundant chrome.\r

  \r

  ### Updating\r

  \r

  - Stable and Beta installations update to separately packaged `0.0.10`\r

  \  application identities on their existing channels."
