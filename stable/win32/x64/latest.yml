releaseName: Fraia 0.0.3
releaseNotes: "### Added\r

  \r

  - Native Windows ARM64 packaging backed by a reviewed ARM64 CalculiX runtime,\r

  \  alongside the existing macOS, Linux, and Windows x64 targets.\r

  - Authenticated automatic updates for Windows and Linux using an embedded,\r

  \  reviewed TUF root and separately protected targets, snapshot, and timestamp\r

  \  signing roles.\r

  \r

  ### Changed\r

  \r

  - The release matrix now requires six native solver-backed packages: macOS\r

  \  ARM64 and x64, Linux ARM64 and x64, and Windows ARM64 and x64.\r

  - Stable and beta feed aliases resolve to the same stable application identity\r

  \  and package bytes rather than separate beta builds.\r

  \r

  ### Security\r

  \r

  - Windows and Linux update metadata is TUF-signed and rejects corrupt,\r

  \  expired, or incorrectly signed targets. Their initial installers remain\r

  \  unsigned and must be accompanied by a clear disclosure, public checksums,\r

  \  and provenance.\r

  \r

  ### Updating\r

  \r

  - Fraia packages check the public stable feed automatically each day by\r

  \  default. macOS retains Developer ID and notarisation verification; Windows\r

  \  and Linux require the embedded TUF trust root. Users can change the\r

  \  frequency from the Fraia menu.\r

  - Windows NSIS and Linux AppImage installations can update in place. Linux DEB\r

  \  and RPM installations remain under their system package manager."
