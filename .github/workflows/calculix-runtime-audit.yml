name: Native CalculiX Runtime Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact native CalculiX review candidate to build
        required: true
        type: choice
        default: darwin-arm64
        options:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-arm64
          - win32-x64
      reviewed_source_run_id:
        description: Successful Linux x64 source run for a Windows candidate
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: fraia-calculix-runtime-audit-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS candidate (${{ matrix.target }})
    if: ${{ startsWith(inputs.target, 'darwin-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'darwin-arm64' && '[{"target":"darwin-arm64","runner":"macos-15"}]' || '[{"target":"darwin-x64","runner":"macos-15-intel"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build and test candidate
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '${{ runner.temp }}/${{ matrix.target }}'
          scripts/build-calculix-macos-runtime.sh \
            --target '${{ matrix.target }}' \
            --output '${{ runner.temp }}/${{ matrix.target }}/runtime' \
            --evidence '${{ runner.temp }}/${{ matrix.target }}/evidence'

      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows candidate (win32-x64)
    if: ${{ inputs.target == 'win32-x64' }}
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add LLVM tools
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path -LiteralPath $llvm)) {
            throw "The hosted runner does not contain LLVM tools at $llvm."
          }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require reviewed source evidence
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace('${{ inputs.reviewed_source_run_id }}')) {
            throw 'win32-x64 requires reviewed_source_run_id from a successful Linux x64 audit.'
          }

      - name: Download hash-reviewed source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculix-linux-x64
          path: ${{ runner.temp }}/reviewed-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reviewed_source_run_id }}

      - name: Build and test candidate
        working-directory: apps/fraia-electron
        shell: pwsh
        run: |
          $root = Join-Path '${{ runner.temp }}' 'win32-x64'
          New-Item -ItemType Directory -Path $root | Out-Null
          ./scripts/build-calculix-windows-runtime.ps1 `
            -OutputDirectory (Join-Path $root 'runtime') `
            -EvidenceDirectory (Join-Path $root 'evidence') `
            -ReviewedSourceDirectory (Join-Path '${{ runner.temp }}' 'reviewed-source\evidence\source-inputs')

      - name: Upload failed reproducibility evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-win32-x64-reproducibility-failure
          path: ${{ runner.temp }}/win32-x64/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-win32-x64
          path: ${{ runner.temp }}/win32-x64
          if-no-files-found: error
          retention-days: 14

  windows-arm64:
    name: Windows candidate (win32-arm64)
    if: ${{ inputs.target == 'win32-arm64' }}
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require native Windows ARM64 host
        shell: pwsh
        run: |
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw 'win32-arm64 requires a native Windows ARM64 hosted runner.'
          }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'The Windows host operating system is not native ARM64.'
          }

      - name: Setup reviewed MSYS2 CLANGARM64 environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            base-devel
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-flang
            mingw-w64-clang-aarch64-llvm-openmp
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-winpthreads

      - name: Build and test candidate
        working-directory: apps/fraia-electron
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -u '${{ runner.temp }}')/win32-arm64"
          mkdir -p "$root"
          ./scripts/build-calculix-windows-arm64-runtime.sh \
            --output "$root/runtime" \
            --evidence "$root/evidence"

      - name: Upload failed reproducibility evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-win32-arm64-failure
          path: ${{ runner.temp }}/win32-arm64/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-win32-arm64
          path: ${{ runner.temp }}/win32-arm64
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux candidate (${{ matrix.target }})
    if: ${{ startsWith(inputs.target, 'linux-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    container:
      image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'linux-arm64' && '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm"}]' || '[{"target":"linux-x64","runner":"ubuntu-24.04"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install snapshot-pinned build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260720T000000Z jammy main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260720T000000Z jammy-updates main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260720T000000Z jammy-security main universe' \
            > /etc/apt/sources.list
          # The digest-pinned minimal image has no CA bundle. apt still verifies
          # Ubuntu's signed repository metadata during this one-package bootstrap.
          apt-get update \
            -o Acquire::Check-Valid-Until=false \
            -o Acquire::https::Verify-Peer=false
          apt-get install --no-install-recommends --yes \
            -o Acquire::https::Verify-Peer=false \
            ca-certificates
          apt-get update -o Acquire::Check-Valid-Until=false
          apt-get install --no-install-recommends --yes \
            binutils \
            build-essential \
            bzip2 \
            cmake \
            curl \
            file \
            gfortran \
            ninja-build \
            patchelf

      - name: Build and test candidate
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '/tmp/${{ matrix.target }}'
          scripts/build-calculix-linux-runtime.sh \
            --target '${{ matrix.target }}' \
            --output '/tmp/${{ matrix.target }}/runtime' \
            --evidence '/tmp/${{ matrix.target }}/evidence'

      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculix-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
