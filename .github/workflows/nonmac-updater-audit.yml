name: Native Windows and Linux Updater Audit

on:
  workflow_call:
    inputs:
      channel:
        description: Stable or beta application identity to exercise
        required: false
        type: string
        default: stable
      target:
        description: Native updater target to exercise
        required: true
        type: string
      previous_version:
        description: Synthetic installed version for the N-1 migration test
        required: true
        type: string
      candidate_artifact_name:
        description: Exact candidate artifact from the calling release workflow
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      channel:
        description: Application identity to exercise
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
      target:
        description: Native updater target to exercise
        required: true
        type: choice
        default: win32-x64
        options:
          - win32-arm64
          - win32-x64
          - linux-arm64
          - linux-x64
      previous_version:
        description: Synthetic installed version for the N-1 migration test
        required: true
        type: string
        default: 0.0.1

permissions:
  contents: read

concurrency:
  group: fraia-nonmac-updater-audit-${{ inputs.channel }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  updater:
    name: Native updater (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'win32-arm64' && 'windows-11-arm' || inputs.target == 'win32-x64' && 'windows-2025' || inputs.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      FRAIA_AUDIT_PLATFORM: ${{ startsWith(inputs.target, 'win32-') && 'win32' || 'linux' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Require the matching native runner
        shell: bash
        run: |
          expected_arch='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          test "$(node -p 'process.arch')" = "$expected_arch"
          if [ "$FRAIA_AUDIT_PLATFORM" = win32 ]; then
            test "$(node -p 'process.platform')" = win32
          else
            test "$(node -p 'process.platform')" = linux
          fi

      - name: Install Linux AppImage test dependencies
        if: ${{ startsWith(inputs.target, 'linux-') }}
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64 xvfb

      - name: Install tools and require the reviewed runtime
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-calculix-runtimes.cjs --target '${{ inputs.target }}'

      - name: Download exact release candidate
        if: ${{ inputs.candidate_artifact_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: candidate

      - name: Download exact public N-1 package
        if: ${{ inputs.candidate_artifact_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ inputs.channel }}'
          platform='${{ startsWith(inputs.target, 'win32-') && 'win32' || 'linux' }}'
          arch='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          prefix=$(node -p "require('./apps/fraia-electron/release-contract.cjs').releaseContract({channel: '$channel', platform: '$platform', arch: '$arch'}).artifactPrefix")
          if [ "$platform" = win32 ]; then
            asset="$prefix-Windows-${arch}-Setup.exe"
          else
            asset="$prefix-Linux-${arch}.AppImage"
          fi
          mkdir previous
          gh release download "v${{ inputs.previous_version }}" \
            --repo "${{ github.repository }}" \
            --pattern "$asset" \
            --pattern SHA256SUMS \
            --dir previous
          (cd previous && grep "  $asset$" SHA256SUMS | sha256sum --check --strict -)

      - name: Create disposable loopback-only TUF trust
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/update-trust '${{ runner.temp }}/fraia-updater-trust'
          test -f build/update-trust/root.json
          cp build/update-trust/root.json \
            '${{ runner.temp }}/fraia-updater-trust/production-root.json'
          rm build/update-trust/root.json
          node scripts/test-tuf-repository.cjs \
            --root build/update-trust/root.json \
            --private-key '${{ runner.temp }}/fraia-updater-trust/private-key.pem'

      - name: Build previous and candidate packages
        if: ${{ inputs.candidate_artifact_name == '' }}
        working-directory: apps/fraia-electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          FRAIA_RELEASE_ARCH: ${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}
          FRAIA_RELEASE_CHANNEL: ${{ inputs.channel }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
          FRAIA_REQUIRE_RELEASE_ICON: '1'
          FRAIA_REQUIRE_TUF_ROOT: '1'
          FRAIA_RELEASE_PLATFORM: ${{ startsWith(inputs.target, 'win32-') && 'win32' || 'linux' }}
        run: |
          set -euo pipefail
          CANDIDATE_VERSION=$(node -p 'require("./package.json").version')
          PREVIOUS_VERSION='${{ inputs.previous_version }}'
          node - "$FRAIA_RELEASE_CHANNEL" "$PREVIOUS_VERSION" "$CANDIDATE_VERSION" <<'NODE'
          const { compareVersions, parseVersion } = require('./release-version-policy.cjs');
          const [, , channel, previousVersion, candidateVersion] = process.argv;
          const previous = parseVersion(previousVersion);
          const candidate = parseVersion(candidateVersion);
          if (channel === 'stable' && (previous.prerelease !== null || candidate.prerelease !== null)) {
            throw new Error('Stable native updater audits require final previous and candidate versions.');
          }
          if (channel !== 'stable' && channel !== 'beta') throw new Error(`Unsupported release channel: ${channel}`);
          if (compareVersions(candidateVersion, previousVersion) <= 0) {
            throw new Error(`Candidate ${candidateVersion} must be newer than previous ${previousVersion}.`);
          }
          NODE
          if ! grep -Fq "## [$PREVIOUS_VERSION]" ../../CHANGELOG.md; then
            node -e 'require("node:fs").appendFileSync("../../CHANGELOG.md", "\n## [" + process.argv[1] + "] - 2026-07-29\n\n### Test fixture\n\n- Synthetic prior package used only for the native updater migration audit.\n")' "$PREVIOUS_VERSION"
          fi
          npm pkg set "version=$PREVIOUS_VERSION"
          export FRAIA_RELEASE_OUTPUT_DIR="$PWD/ci-updater/previous"
          arch='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          if [ "$FRAIA_AUDIT_PLATFORM" = win32 ]; then
            export FRAIA_E2E_UPDATER=1
            export FRAIA_NSIS_ASSISTED_MIGRATION_FIXTURE=1
            npx --no-install electron-builder --config electron-builder.config.cjs --win nsis "--${arch}" --publish never
            unset FRAIA_E2E_UPDATER FRAIA_NSIS_ASSISTED_MIGRATION_FIXTURE
          elif [ '${{ inputs.target }}' = linux-arm64 ]; then
            npx --no-install electron-builder --config electron-builder.config.cjs --linux AppImage --arm64 --publish never
          else
            npx --no-install electron-builder --config electron-builder.config.cjs --linux AppImage --x64 --publish never
          fi
          npm pkg set "version=$CANDIDATE_VERSION"
          export FRAIA_RELEASE_OUTPUT_DIR="$PWD/ci-updater/candidate"
          if [ "$FRAIA_AUDIT_PLATFORM" = win32 ]; then
            npx --no-install electron-builder --config electron-builder.config.cjs --win nsis "--${arch}" --publish never
          elif [ '${{ inputs.target }}' = linux-arm64 ]; then
            npx --no-install electron-builder --config electron-builder.config.cjs --linux AppImage --arm64 --publish never
          else
            npx --no-install electron-builder --config electron-builder.config.cjs --linux AppImage --x64 --publish never
          fi
          test "$(node -p 'require("./package.json").version')" = "$CANDIDATE_VERSION"

      - name: Exercise authenticated native N-1 replacement
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          channel='${{ inputs.channel }}'
          platform='${{ startsWith(inputs.target, 'win32-') && 'win32' || 'linux' }}'
          arch='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          prefix=$(node -p "require('./release-contract.cjs').releaseContract({channel: '$channel', platform: '$platform', arch: '$arch'}).artifactPrefix")
          if [ -n '${{ inputs.candidate_artifact_name }}' ]; then
            previous_root="$GITHUB_WORKSPACE/previous"
            candidate_assets_root="$GITHUB_WORKSPACE/candidate/assets"
            candidate_metadata="$candidate_assets_root/update-$channel-$platform-$arch.yml"
          else
            previous_root="$PWD/ci-updater/previous"
            candidate_assets_root="$PWD/ci-updater/candidate"
          fi
          if [ "$FRAIA_AUDIT_PLATFORM" = win32 ]; then
            if [ -z '${{ inputs.candidate_artifact_name }}' ]; then candidate_metadata="$candidate_assets_root/latest.yml"; fi
            node scripts/test-nonmac-update.cjs \
              --channel "$channel" \
              --arch "$arch" \
              --previous-artifact "$previous_root/$prefix-Windows-${arch}-Setup.exe" \
              --candidate-directory "$candidate_assets_root" \
              --candidate-metadata "$candidate_metadata" \
              --root build/update-trust/root.json \
              --private-key '${{ runner.temp }}/fraia-updater-trust/private-key.pem' \
              --evidence '${{ runner.temp }}/fraia-updater-evidence'
          else
            metadata='${{ inputs.target == 'linux-arm64' && 'latest-linux-arm64.yml' || 'latest-linux.yml' }}'
            if [ -z '${{ inputs.candidate_artifact_name }}' ]; then candidate_metadata="$candidate_assets_root/$metadata"; fi
            xvfb-run -a node scripts/test-nonmac-update.cjs \
              --channel "$channel" \
              --arch "$arch" \
              --previous-artifact "$previous_root/$prefix-Linux-${arch}.AppImage" \
              --candidate-directory "$candidate_assets_root" \
              --candidate-metadata "$candidate_metadata" \
              --root build/update-trust/root.json \
              --private-key '${{ runner.temp }}/fraia-updater-trust/private-key.pem' \
              --evidence '${{ runner.temp }}/fraia-updater-evidence'
          fi

      - name: Upload review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-${{ inputs.channel }}-${{ inputs.target }}-updater-evidence
          path: ${{ runner.temp }}/fraia-updater-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable private key and package outputs
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf '${{ runner.temp }}/fraia-updater-trust'
          rm -rf apps/fraia-electron/ci-updater apps/fraia-electron/build/update-trust
