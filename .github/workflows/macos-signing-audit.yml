name: macOS signing audit

on:
  workflow_call:
    inputs:
      channel:
        description: Stable or beta application identity to sign
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      channel:
        description: Application identity to sign
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: fraia-macos-signing-audit-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  package:
    name: Signed macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    environment: release-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FRAIA_XCODE_VERSION: '26.1.1'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Verify native runner and reviewed Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          EXPECTED="${{ matrix.arch }}"
          if [ "$EXPECTED" = x64 ]; then EXPECTED=x86_64; fi
          test "$(uname -m)" = "$EXPECTED"
          test -x "$DEVELOPER_DIR/usr/bin/actool"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode $FRAIA_XCODE_VERSION"
          test "$(xcrun --find actool)" = "$DEVELOPER_DIR/usr/bin/actool"

      - name: Install dependencies
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Build renderer and native Rust sidecar without release credentials
        working-directory: apps/fraia-electron
        run: npm run build && npm run build:sidecar

      - name: Build, sign, notarize, and staple
        working-directory: apps/fraia-electron
        env:
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FRAIA_RELEASE_ARCH: ${{ matrix.arch }}
          FRAIA_RELEASE_CHANNEL: ${{ inputs.channel }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
          FRAIA_REQUIRE_RELEASE_ICON: '1'
          FRAIA_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/apps/fraia-electron/release/${{ inputs.channel }}/darwin/${{ matrix.arch }}
          FRAIA_RELEASE_PLATFORM: darwin
        run: npm run package:release:mac -- --channel "$FRAIA_RELEASE_CHANNEL" --arch "$FRAIA_RELEASE_ARCH" --output-dir "$FRAIA_RELEASE_OUTPUT_DIR"

      - name: Verify signatures, notarization, Gatekeeper, launch, and solver without credentials
        working-directory: apps/fraia-electron
        env:
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
        run: >-
          npm run verify:release:mac --
          --channel "${{ inputs.channel }}"
          --arch "${{ matrix.arch }}"
          --output-dir "release/${{ inputs.channel }}/darwin/${{ matrix.arch }}"

      - name: Assemble reusable signed candidate
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          ARCH="${{ matrix.arch }}"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          OUTPUT="release/$CHANNEL/darwin/$ARCH"
          mkdir -p ci-output/assets ci-output/feed
          node scripts/assemble-update-metadata.mjs \
            --input "$OUTPUT/latest-mac.yml" \
            --artifact-dir "$OUTPUT" \
            --output-root ci-output/feed \
            --audit-output "ci-output/assets/update-$CHANNEL-darwin-$ARCH.yml" \
            --channel "$CHANNEL" \
            --platform darwin \
            --arch "$ARCH" \
            --tag "$TAG" \
            --repository "${{ github.repository }}"
          PREFIX=$(node -p "require('./release-contract.cjs').releaseContract({channel: '$CHANNEL', platform: 'darwin', arch: '$ARCH'}).artifactPrefix")
          STEM="$PREFIX-macOS-$ARCH"
          cp "$OUTPUT/$STEM.dmg" "$OUTPUT/$STEM.dmg.blockmap" "$OUTPUT/$STEM.dmg.sha256" ci-output/assets/
          cp "$OUTPUT/$STEM.zip" "$OUTPUT/$STEM.zip.blockmap" "$OUTPUT/$STEM.zip.sha256" ci-output/assets/
          cp "$OUTPUT/notarization-$CHANNEL-$ARCH.json" ci-output/assets/

      - name: Upload independently reviewable signed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-${{ inputs.channel }}-darwin-${{ matrix.arch }}
          path: apps/fraia-electron/ci-output
          if-no-files-found: error
          retention-days: 14
