name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      simulation_candidate_version:
        description: Unpublished candidate version built only for this simulation
        required: true
        type: string
        default: 0.0.15
      simulation_previous_version:
        description: Prior version used by updater replacement simulations
        required: true
        type: string
        default: 0.0.14
permissions:
  actions: read
  contents: read

concurrency:
  group: fraia-updater-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      channels: ${{ steps.release.outputs.channels }}
      channels_csv: ${{ steps.release.outputs.channels_csv }}
      previous_beta_version: ${{ steps.release.outputs.previous_beta_version }}
      previous_stable_version: ${{ steps.release.outputs.previous_stable_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      simulation: ${{ steps.release.outputs.simulation }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout current updater feeds
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: published-feed
          ref: updates

      - name: Require an owner-authorized release actor
        env:
          AUTHORIZED_RELEASE_ACTOR: apotenza92
          RELEASE_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_ACTOR" != "$AUTHORIZED_RELEASE_ACTOR" ]; then
            echo "::error::Release tags must be pushed by $AUTHORIZED_RELEASE_ACTOR; received $RELEASE_ACTOR"
            exit 1
          fi

      - name: Prove tag commit belongs to the approved release source
        if: ${{ github.event_name == 'push' }}
        env:
          APPROVED_RELEASE_BRANCH: main
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != "$APPROVED_RELEASE_BRANCH" ]; then
            echo "::error::Repository default branch $DEFAULT_BRANCH is not approved release source $APPROVED_RELEASE_BRANCH"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          git show-ref --verify --quiet "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"; then
            echo "::error::Release tag $RELEASE_TAG does not belong to $APPROVED_RELEASE_BRANCH"
            exit 1
          fi

      - name: Require a public updater and binary origin
        env:
          SOURCE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$SOURCE_REPOSITORY_PRIVATE" != false ]; then
            echo 'Fraia release clients require this source repository, GitHub Releases, update feeds, and provenance to remain publicly reachable without authentication.' >&2
            exit 1
          fi

      - name: Validate tag and package versions
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            readPublishedChannelVersion,
            releasePolicy,
          } = require('./apps/fraia-electron/release-version-policy.cjs');
          const packageJson = require('./apps/fraia-electron/package.json');
          const cargo = fs.readFileSync('Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/\[workspace\.package\][\s\S]*?\nversion\s*=\s*"([^"]+)"/)?.[1];
          const simulation = process.env.GITHUB_EVENT_NAME !== 'push';
          const simulationVersion = process.env.SIMULATION_CANDIDATE_VERSION;
          const tag = simulation ? `v${simulationVersion}` : process.env.GITHUB_REF_NAME;
          const stable = /^v\d+\.\d+\.\d+$/.test(tag);
          const beta = /^v\d+\.\d+\.\d+-beta\.\d+$/.test(tag);
          if (!stable && !beta) {
            throw new Error(`Fraia release tags must be vX.Y.Z or vX.Y.Z-beta.N; received ${tag}.`);
          }
          const version = tag.slice(1);
          if (!simulation && (packageJson.version !== version || cargoVersion !== version)) {
            throw new Error(`Tag ${tag} must match Electron ${packageJson.version} and Cargo ${cargoVersion}.`);
          }
          const channel = beta ? 'beta' : 'stable';
          if (simulation) {
            const previousVersion = process.env.SIMULATION_PREVIOUS_VERSION;
            const output = {
              channel: 'stable',
              channels: JSON.stringify(['stable', 'beta']),
              channels_csv: 'stable,beta',
              previous_beta_version: previousVersion,
              previous_stable_version: previousVersion,
              prerelease: 'false',
              release_tag: tag,
              simulation: 'true',
              version: simulationVersion,
            };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${Object.entries(output).map(([key, value]) => `${key}=${value}`).join('\n')}\n`);
            process.exit(0);
          }
          const currentStableVersion = readPublishedChannelVersion(path.resolve('published-feed'), 'stable');
          const currentBetaVersion = readPublishedChannelVersion(path.resolve('published-feed'), 'beta');
          if (!currentStableVersion || !currentBetaVersion) {
            throw new Error('Stable-inclusive releases require complete existing stable and beta feeds.');
          }
          const policy = releasePolicy({
            tagChannel: channel,
            candidateVersion: version,
            currentStableVersion,
            currentBetaVersion,
          });
          const output = {
            channel,
            channels: JSON.stringify(policy.channels),
            channels_csv: policy.channels.join(','),
            previous_beta_version: policy.previousBetaVersion,
            previous_stable_version: policy.previousStableVersion,
            prerelease: String(beta),
            release_tag: tag,
            simulation: 'false',
            version,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${Object.entries(output).map(([key, value]) => `${key}=${value}`).join('\n')}\n`);
          NODE
        env:
          SIMULATION_CANDIDATE_VERSION: ${{ inputs.simulation_candidate_version }}
          SIMULATION_PREVIOUS_VERSION: ${{ inputs.simulation_previous_version }}

  resolve-macos-candidate:
    name: Resolve exact prebuilt macOS candidate
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find successful candidate for this exact commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          SIMULATION: ${{ needs.prepare.outputs.simulation }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'reuse=false\nrun_id=\n' >> "$GITHUB_OUTPUT"
          if [ "$SIMULATION" = true ]; then exit 0; fi
          RUN_ID=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/macos-release-candidate.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$RELEASE_SHA\")) | sort_by(.run_number) | reverse | .[0].id // empty" | head -1)
          if [ -z "$RUN_ID" ]; then exit 0; fi
          mapfile -t ARTIFACTS < <(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' | LC_ALL=C sort)
          REQUIRED=(fraia-beta-darwin-arm64 fraia-beta-darwin-x64 fraia-macos-candidate-manifest)
          if [ '${{ needs.prepare.outputs.channel }}' = stable ]; then
            REQUIRED+=(fraia-stable-darwin-arm64 fraia-stable-darwin-x64)
          fi
          for name in "${REQUIRED[@]}"; do
            if ! printf '%s\n' "${ARTIFACTS[@]}" | grep -Fxq "$name"; then exit 0; fi
          done
          printf 'reuse=true\nrun_id=%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"

  validate:
    name: Unprivileged release gate
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Require the declared repository license
        run: test -f LICENSE

      - name: Require authoritative release notes
        shell: bash
        run: |
          NOTES_VERSION='${{ needs.prepare.outputs.version }}'
          if [ '${{ needs.prepare.outputs.simulation }}' = true ]; then
            NOTES_VERSION=$(node -p "require('./apps/fraia-electron/package.json').version")
          fi
          node apps/fraia-electron/scripts/changelog.cjs --version "$NOTES_VERSION" --output /tmp/fraia-release-notes.md

      - name: Require maintained release icons
        run: |
          cd apps/fraia-electron
          npm run check:icons
          test -f build/macos/Fraia.icon/icon.json
          test -f build/macos/Fraia.icon/Assets/01-artwork.svg
          test -f build/macos/Fraia.icon/Assets/01-artwork-dark.svg
          test -f build/icon.png
          test -f build/generated-icon-manifest.json
          test -f build/icon.icns
          test -f build/icon.ico
          test -f build/icons/512x512.png
          test -f "build/beta/macos/Fraia Beta.icon/icon.json"
          test -f "build/beta/macos/Fraia Beta.icon/Assets/01-artwork.svg"
          test -f "build/beta/macos/Fraia Beta.icon/Assets/01-artwork-dark.svg"
          test -f build/beta/icon.png
          test -f build/beta/generated-icon-manifest.json
          test -f build/beta/icon.icns
          test -f build/beta/icon.ico
          test -f build/beta/icons/512x512.png

      - name: Require reviewed native CalculiX runtime manifests
        run: node apps/fraia-electron/scripts/verify-calculix-runtimes.cjs --all --skip-dependency-inspection

      - name: Repository and Rust checks
        env:
          PYTHONPYCACHEPREFIX: /tmp/fraia-pycache
        run: |
          python3 scripts/check-repository-hygiene.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features
          cargo test --workspace --all-features
          python3 scripts/lint-knowledge.py
          python3 scripts/validate-knowledge-next.py

      - name: Electron checks
        working-directory: apps/fraia-electron
        run: npm run typecheck && npm run build && npm run verify:import-runtimes:built && xvfb-run -a npm test

      - name: Upload validated renderer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-validated-renderer
          path: apps/fraia-electron/dist
          if-no-files-found: error
          retention-days: 14

  build-sidecar:
    name: Native sidecar ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-26
          - platform: darwin
            arch: x64
            runner: macos-26-intel
          - platform: win32
            arch: arm64
            runner: windows-11-arm
          - platform: win32
            arch: x64
            runner: windows-2025
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore native Rust build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify native runner
        shell: bash
        run: test "$(node -p 'process.platform')" = "${{ matrix.platform }}" && test "$(node -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Build reviewed native sidecar once
        working-directory: apps/fraia-electron
        run: npm run build:sidecar

      - name: Archive native sidecar with executable mode
        shell: bash
        run: |
          ARCHIVE_ROOT="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = win32 ]; then ARCHIVE_ROOT=$(cygpath -u "$RUNNER_TEMP"); fi
          tar -czf "$ARCHIVE_ROOT/native-sidecar.tar.gz" -C apps/fraia-electron .package/sidecar/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload reusable native sidecar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-sidecar-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-sidecar.tar.gz
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: macOS ${{ matrix.channel }} ${{ matrix.arch }}
    needs: [prepare, resolve-macos-candidate, validate, build-sidecar]
    if: ${{ needs.prepare.outputs.simulation != 'true' && needs.resolve-macos-candidate.outputs.reuse != 'true' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    environment: release-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FRAIA_XCODE_VERSION: '26.1.1'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Verify native runner
        shell: bash
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          EXPECTED="${{ matrix.arch }}"
          if [ "$EXPECTED" = x64 ]; then EXPECTED=x86_64; fi
          test "$(uname -m)" = "$EXPECTED"

      - name: Verify reviewed Xcode
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/actool"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode $FRAIA_XCODE_VERSION"
          test "$(xcrun --find actool)" = "$DEVELOPER_DIR/usr/bin/actool"

      - name: Restore packaging dependencies
        id: packaging-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/fraia-electron/node_modules
          key: fraia-packaging-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('apps/fraia-electron/package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.packaging-dependencies.outputs.cache-hit != 'true' }}
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Download validated renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-validated-renderer
          path: apps/fraia-electron/dist

      - name: Download reviewed native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-sidecar-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-sidecar

      - name: Restore reviewed native sidecar
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/native-sidecar/native-sidecar.tar.gz" -C apps/fraia-electron

      - name: Build, sign, notarize, and staple
        working-directory: apps/fraia-electron
        env:
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FRAIA_RELEASE_ARCH: ${{ matrix.arch }}
          FRAIA_RELEASE_CHANNEL: ${{ matrix.channel }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
          FRAIA_REQUIRE_RELEASE_ICON: '1'
          FRAIA_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/apps/fraia-electron/release/${{ matrix.channel }}/darwin/${{ matrix.arch }}
          FRAIA_RELEASE_PLATFORM: darwin
        run: npm run package:release:mac -- --channel "$FRAIA_RELEASE_CHANNEL" --arch "$FRAIA_RELEASE_ARCH" --output-dir "$FRAIA_RELEASE_OUTPUT_DIR"

      - name: Verify signatures and launch without release credentials
        working-directory: apps/fraia-electron
        env:
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
        run: >-
          npm run verify:release:mac --
          --channel "${{ matrix.channel }}"
          --arch "${{ matrix.arch }}"
          --output-dir "release/${{ matrix.channel }}/darwin/${{ matrix.arch }}"

      - name: Assemble versioned macOS update metadata
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="release/${{ matrix.channel }}/darwin/${{ matrix.arch }}"
          mkdir -p ci-output/assets ci-output/feed
          CHANNEL="${{ matrix.channel }}"
          node scripts/assemble-update-metadata.mjs \
            --input "$OUTPUT/latest-mac.yml" \
            --artifact-dir "$OUTPUT" \
            --output-root ci-output/feed \
            --audit-output "ci-output/assets/update-$CHANNEL-darwin-${{ matrix.arch }}.yml" \
            --channel "$CHANNEL" \
            --platform darwin \
            --arch "${{ matrix.arch }}" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --repository "${{ github.repository }}"
          PREFIX=$(node -p "require('./release-contract.cjs').releaseContract({channel: '$CHANNEL', platform: 'darwin', arch: '${{ matrix.arch }}'}).artifactPrefix")
          STEM="$PREFIX-macOS-${{ matrix.arch }}"
          cp "$OUTPUT/$STEM.dmg" "$OUTPUT/$STEM.dmg.blockmap" "$OUTPUT/$STEM.dmg.sha256" ci-output/assets/
          cp "$OUTPUT/$STEM.zip" "$OUTPUT/$STEM.zip.blockmap" "$OUTPUT/$STEM.zip.sha256" ci-output/assets/
          cp "$OUTPUT/notarization-${{ matrix.channel }}-${{ matrix.arch }}.json" ci-output/assets/

      - name: Upload macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-${{ matrix.channel }}-darwin-${{ matrix.arch }}
          path: apps/fraia-electron/ci-output
          if-no-files-found: error
          retention-days: 14

  import-macos-candidate:
    name: Import exact prebuilt macOS candidate
    needs: [prepare, resolve-macos-candidate]
    if: ${{ needs.resolve-macos-candidate.outputs.reuse == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all sealed candidate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fraia-*-darwin-*
          path: candidate
          run-id: ${{ needs.resolve-macos-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download sealed manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-macos-candidate-manifest
          path: manifest
          run-id: ${{ needs.resolve-macos-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact commit, version, channels, files, and digests
        run: >-
          node apps/fraia-electron/scripts/macos-candidate-manifest.cjs verify
          --root candidate
          --manifest manifest/macos-candidate-manifest.json
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --version "${{ needs.prepare.outputs.version }}"
      - name: Re-upload Stable ARM64 candidate
        if: ${{ needs.prepare.outputs.channel == 'stable' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-stable-darwin-arm64
          path: candidate/fraia-stable-darwin-arm64
          if-no-files-found: error
          retention-days: 14
      - name: Re-upload Stable Intel candidate
        if: ${{ needs.prepare.outputs.channel == 'stable' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-stable-darwin-x64
          path: candidate/fraia-stable-darwin-x64
          if-no-files-found: error
          retention-days: 14
      - name: Re-upload Beta ARM64 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-beta-darwin-arm64
          path: candidate/fraia-beta-darwin-arm64
          if-no-files-found: error
          retention-days: 14
      - name: Re-upload Beta Intel candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-beta-darwin-x64
          path: candidate/fraia-beta-darwin-x64
          if-no-files-found: error
          retention-days: 14

  macos-candidates-ready:
    name: Exact macOS candidates ready
    needs: [prepare, resolve-macos-candidate, package-macos, import-macos-candidate]
    if: ${{ always() && needs.prepare.outputs.simulation != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require one successful candidate source
        env:
          BUILT_RESULT: ${{ needs.package-macos.result }}
          IMPORTED_RESULT: ${{ needs.import-macos-candidate.result }}
        run: test "$BUILT_RESULT" = success -o "$IMPORTED_RESULT" = success

  package-windows:
    name: Windows ${{ matrix.channel }} ${{ matrix.arch }}
    needs: [prepare, validate, build-sidecar]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Verify native runner
        shell: bash
        run: test "$(node -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Restore packaging dependencies
        id: packaging-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/fraia-electron/node_modules
          key: fraia-packaging-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('apps/fraia-electron/package-lock.json') }}

      - name: Install packaging dependencies
        if: ${{ steps.packaging-dependencies.outputs.cache-hit != 'true' }}
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Download validated renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-validated-renderer
          path: apps/fraia-electron/dist

      - name: Download reviewed native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-sidecar-win32-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-sidecar

      - name: Restore reviewed native sidecar
        shell: bash
        run: tar -xzf "$(cygpath -u "$RUNNER_TEMP")/native-sidecar/native-sidecar.tar.gz" -C apps/fraia-electron

      - name: Set unpublished simulation version
        if: ${{ needs.prepare.outputs.simulation == 'true' }}
        working-directory: apps/fraia-electron
        run: npm version '${{ needs.prepare.outputs.version }}' --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        working-directory: apps/fraia-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          FRAIA_RELEASE_ARCH: ${{ matrix.arch }}
          FRAIA_RELEASE_CHANNEL: ${{ matrix.channel }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
          FRAIA_REQUIRE_RELEASE_ICON: '1'
          FRAIA_REQUIRE_TUF_ROOT: '1'
          FRAIA_RELEASE_OUTPUT_DIR: ${{ github.workspace }}\apps\fraia-electron\release\${{ matrix.channel }}\win32\${{ matrix.arch }}
          FRAIA_RELEASE_NOTES_VERSION: ${{ needs.prepare.outputs.simulation == 'true' && '0.0.14' || needs.prepare.outputs.version }}
          FRAIA_RELEASE_PLATFORM: win32
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --${{ matrix.arch }} --publish never

      - name: Install, launch, and uninstall Windows package
        working-directory: apps/fraia-electron
        run: >-
          node scripts/verify-native-package.cjs
          --channel "${{ matrix.channel }}"
          --arch "${{ matrix.arch }}"
          --output-dir "release/${{ matrix.channel }}/win32/${{ matrix.arch }}"

      - name: Assemble authenticated Windows update target
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/assets
          OUTPUT="release/${{ matrix.channel }}/win32/${{ matrix.arch }}"
          CHANNEL="${{ matrix.channel }}"
          node scripts/assemble-update-metadata.mjs \
            --input "$OUTPUT/latest.yml" \
            --artifact-dir "$OUTPUT" \
            --output-root ci-output/feed \
            --audit-output "ci-output/assets/update-$CHANNEL-win32-${{ matrix.arch }}.yml" \
            --channel "$CHANNEL" \
            --platform win32 \
            --arch "${{ matrix.arch }}" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --repository "${{ github.repository }}"
          PREFIX=$(node -p "require('./release-contract.cjs').releaseContract({channel: '$CHANNEL', platform: 'win32', arch: '${{ matrix.arch }}'}).artifactPrefix")
          STEM="$PREFIX-Windows-${{ matrix.arch }}-Setup.exe"
          cp "$OUTPUT/$STEM" "$OUTPUT/$STEM.blockmap" ci-output/assets/
          mkdir -p ci-output/audit
          UNPACKED='${{ matrix.arch == 'x64' && 'win-unpacked' || 'win-arm64-unpacked' }}'
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const file=process.argv[1];process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')+'\\n')" \
            "$OUTPUT/$UNPACKED/resources/app.asar" > ci-output/audit/app.asar.sha256

      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-${{ matrix.channel }}-win32-${{ matrix.arch }}
          path: apps/fraia-electron/ci-output
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Linux ${{ matrix.channel }} ${{ matrix.arch }}
    needs: [prepare, validate, build-sidecar]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Verify native runner
        run: test "$(node -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y cpio fakeroot rpm

      - name: Restore packaging dependencies
        id: packaging-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/fraia-electron/node_modules
          key: fraia-packaging-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('apps/fraia-electron/package-lock.json') }}

      - name: Install packaging dependencies
        if: ${{ steps.packaging-dependencies.outputs.cache-hit != 'true' }}
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Download validated renderer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-validated-renderer
          path: apps/fraia-electron/dist

      - name: Download reviewed native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-sidecar-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-sidecar

      - name: Restore reviewed native sidecar
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/native-sidecar/native-sidecar.tar.gz" -C apps/fraia-electron

      - name: Set unpublished simulation version
        if: ${{ needs.prepare.outputs.simulation == 'true' }}
        working-directory: apps/fraia-electron
        run: npm version '${{ needs.prepare.outputs.version }}' --no-git-tag-version --allow-same-version

      - name: Build Linux packages
        working-directory: apps/fraia-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          FRAIA_RELEASE_ARCH: ${{ matrix.arch }}
          FRAIA_RELEASE_CHANNEL: ${{ matrix.channel }}
          FRAIA_REQUIRE_PACKAGED_CALCULIX: '1'
          FRAIA_REQUIRE_RELEASE_ICON: '1'
          FRAIA_REQUIRE_TUF_ROOT: '1'
          FRAIA_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/apps/fraia-electron/release/${{ matrix.channel }}/linux/${{ matrix.arch }}
          FRAIA_RELEASE_NOTES_VERSION: ${{ needs.prepare.outputs.simulation == 'true' && '0.0.14' || needs.prepare.outputs.version }}
          FRAIA_RELEASE_PLATFORM: linux
        run: npx --no-install electron-builder --config electron-builder.config.cjs --linux AppImage deb rpm --${{ matrix.arch }} --publish never

      - name: Extract and launch every Linux package
        working-directory: apps/fraia-electron
        run: >-
          xvfb-run -a node scripts/verify-native-package.cjs
          --channel "${{ matrix.channel }}"
          --arch "${{ matrix.arch }}"
          --output-dir "release/${{ matrix.channel }}/linux/${{ matrix.arch }}"

      - name: Assemble authenticated AppImage update target
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/assets
          OUTPUT="release/${{ matrix.channel }}/linux/${{ matrix.arch }}"
          METADATA_NAME=$(node -p "require('./release-contract.cjs').metadataFileName('linux', '${{ matrix.arch }}')")
          CHANNEL="${{ matrix.channel }}"
          node scripts/assemble-update-metadata.mjs \
            --input "$OUTPUT/$METADATA_NAME" \
            --artifact-dir "$OUTPUT" \
            --output-root ci-output/feed \
            --audit-output "ci-output/assets/update-$CHANNEL-linux-${{ matrix.arch }}.yml" \
            --channel "$CHANNEL" \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --repository "${{ github.repository }}"
          PREFIX=$(node -p "require('./release-contract.cjs').releaseContract({channel: '$CHANNEL', platform: 'linux', arch: '${{ matrix.arch }}'}).artifactPrefix")
          STEM="$PREFIX-Linux-${{ matrix.arch }}"
          cp "$OUTPUT/$STEM.AppImage" "$OUTPUT/$STEM.deb" "$OUTPUT/$STEM.rpm" ci-output/assets/

      - name: Upload Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-${{ matrix.channel }}-linux-${{ matrix.arch }}
          path: apps/fraia-electron/ci-output
          if-no-files-found: error
          retention-days: 14

  test-macos-updater:
    name: macOS updater ${{ matrix.channel }} ${{ matrix.scenario }} ${{ matrix.arch }}
    needs: [prepare, macos-candidates-ready]
    if: ${{ needs.prepare.outputs.simulation != 'true' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    environment:
      name: ${{ matrix.channel }}-updater-verification
    permissions:
      attestations: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        arch: [arm64, x64]
        scenario: [valid]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/fraia-electron/package-lock.json

      - name: Install dependencies
        working-directory: apps/fraia-electron
        run: npm ci

      - name: Download signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-${{ matrix.channel }}-darwin-${{ matrix.arch }}
          path: candidate

      - name: Resolve previous public channel package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PREVIOUS_VERSION: ${{ matrix.channel == 'stable' && needs.prepare.outputs.previous_stable_version || needs.prepare.outputs.previous_beta_version }}
          RELEASE_CHANNEL: ${{ matrix.channel }}
          RELEASE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" > releases.json
          node <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8')).flat();
          const prefix = process.env.RELEASE_CHANNEL === 'beta' ? 'Fraia-Beta' : 'Fraia';
          const asset = `${prefix}-macOS-${process.env.RELEASE_ARCH}.zip`;
          const expectedTag = `v${process.env.EXPECTED_PREVIOUS_VERSION}`;
          const previous = releases.find((release) => (
            !release.draft
            && release.tag_name === expectedTag
            && release.assets.some((candidate) => candidate.name === asset)
          ));
          if (!previous) {
            throw new Error(`Published ${process.env.RELEASE_CHANNEL} feed ${process.env.EXPECTED_PREVIOUS_VERSION} has no matching ${asset} release asset.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${previous.tag_name}\nasset=${asset}\n`);
          NODE
      - name: Download and test N-1 update
        env:
          APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir previous
          gh release download "${{ steps.previous.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.previous.outputs.asset }}" \
            --pattern SHA256SUMS \
            --dir previous
          node apps/fraia-electron/scripts/test-macos-update.cjs \
            --scenario "${{ matrix.scenario }}" \
            --channel "${{ matrix.channel }}" \
            --arch "${{ matrix.arch }}" \
            --previous-zip "previous/${{ steps.previous.outputs.asset }}" \
            --previous-checksums previous/SHA256SUMS \
            --candidate-directory candidate/assets \
            --candidate-metadata "candidate/assets/update-${{ matrix.channel }}-darwin-${{ matrix.arch }}.yml" \
            --repository "${{ github.repository }}"

  test-nonmac-updater:
    name: Native updater ${{ matrix.channel }} ${{ matrix.target }}
    needs: [prepare, package-windows, package-linux]
    if: ${{ needs.prepare.outputs.simulation != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        target: [win32-arm64, win32-x64, linux-arm64, linux-x64]
    uses: ./.github/workflows/nonmac-updater-audit.yml
    with:
      channel: ${{ matrix.channel }}
      target: ${{ matrix.target }}
      previous_version: ${{ matrix.channel == 'stable' && needs.prepare.outputs.previous_stable_version || needs.prepare.outputs.previous_beta_version }}
      candidate_artifact_name: fraia-${{ matrix.channel }}-${{ matrix.target }}

  assemble:
    name: Assemble exact release bundle
    needs: [prepare, macos-candidates-ready, package-windows, package-linux, test-macos-updater, test-nonmac-updater]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download all candidates without merging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fraia-*
          path: candidates

      - name: Assemble deterministic CalculiX corresponding source
        working-directory: apps/fraia-electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/calculix-source-cache" \
            "${{ github.workspace }}/candidates/calculix-source/assets"
          node scripts/assemble-calculix-corresponding-source.cjs \
            --cache "${{ runner.temp }}/calculix-source-cache" \
            --output "${{ github.workspace }}/candidates/calculix-source/assets/Fraia-CalculiX-Corresponding-Source.tar"
          node scripts/verify-calculix-corresponding-source.cjs \
            --bundle "${{ github.workspace }}/candidates/calculix-source/assets/Fraia-CalculiX-Corresponding-Source.tar" \
            --repository "${{ github.repository }}" \
            --runtime-root runtimes/calculix \
            --tag "${{ needs.prepare.outputs.release_tag }}"

      - name: Assemble and validate exact assets and feeds
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t INPUTS < <(find candidates -type d -name assets | LC_ALL=C sort)
          ARGS=()
          for input in "${INPUTS[@]}"; do ARGS+=(--input "$input"); done
          node apps/fraia-electron/scripts/release-assets.cjs \
            --channels "${{ needs.prepare.outputs.channels_csv }}" \
            --output publish/assets \
            "${ARGS[@]}" > expected-assets.txt
          mkdir -p publish/feed
          while IFS= read -r feed_root; do cp -R "$feed_root/." publish/feed/; done < <(find candidates -type d -name feed | LC_ALL=C sort)
          IFS=, read -r -a CHANNELS <<< "${{ needs.prepare.outputs.channels_csv }}"
          for CHANNEL in "${CHANNELS[@]}"; do
            test "$(find "publish/feed/$CHANNEL" -type f | wc -l | tr -d ' ')" = 6
          done

      - name: Build deterministic tap-owned Homebrew publication bundle
        working-directory: apps/fraia-electron
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-homebrew-publication.cjs \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --assets "$GITHUB_WORKSPACE/publish/assets" \
            --output "$RUNNER_TEMP/homebrew-publication"
          python3 scripts/create-homebrew-archive.py \
            "$RUNNER_TEMP/homebrew-publication" \
            "$GITHUB_WORKSPACE/publish/assets/homebrew-publication.tar.gz"
          printf '%s\n' homebrew-publication.tar.gz >> "$GITHUB_WORKSPACE/expected-assets.txt"
          LC_ALL=C sort -u -o "$GITHUB_WORKSPACE/expected-assets.txt" "$GITHUB_WORKSPACE/expected-assets.txt"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-release-assets
          path: publish/assets
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned updater feeds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-update-feeds-unsigned
          path: publish/feed
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest release bundle
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-release-assets
          path: publish/assets

      - name: Attest every checksummed asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: publish/assets/*

  seal-tuf:
    name: Sign Windows and Linux update repositories
    needs: [prepare, assemble]
    if: ${{ needs.prepare.outputs.simulation != 'true' }}
    runs-on: ubuntu-24.04
    environment: update-signing
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Checkout prior updater metadata
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: previous-feed
          ref: updates

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/apps/fraia-electron/package-lock.json

      - name: Install signing dependencies
        working-directory: source/apps/fraia-electron
        run: npm ci

      - name: Download unsigned updater feeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-update-feeds-unsigned
          path: publish/feed

      - name: Sign exact Windows and AppImage metadata
        env:
          FRAIA_TUF_SNAPSHOT_PRIVATE_KEY_PEM: ${{ secrets.FRAIA_TUF_SNAPSHOT_PRIVATE_KEY_PEM }}
          FRAIA_TUF_TARGETS_PRIVATE_KEY_PEM: ${{ secrets.FRAIA_TUF_TARGETS_PRIVATE_KEY_PEM }}
          FRAIA_TUF_TIMESTAMP_PRIVATE_KEY_PEM: ${{ secrets.FRAIA_TUF_TIMESTAMP_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          export FRAIA_TUF_METADATA_NOW
          FRAIA_TUF_METADATA_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ROOT="$GITHUB_WORKSPACE/source/apps/fraia-electron/build/update-trust/root.json"
          IFS=, read -r -a CHANNELS <<< "${{ needs.prepare.outputs.channels_csv }}"
          for CHANNEL in "${CHANNELS[@]}"; do
            for PLATFORM in win32 linux; do
              for ARCH in arm64 x64; do
                FEED="$GITHUB_WORKSPACE/publish/feed/$CHANNEL/$PLATFORM/$ARCH"
                TARGET_NAME=$(node -p \
                  "require('$GITHUB_WORKSPACE/source/apps/fraia-electron/release-contract.cjs').metadataFileName('$PLATFORM', '$ARCH')")
                PREVIOUS="$GITHUB_WORKSPACE/previous-feed/$CHANNEL/$PLATFORM/$ARCH/tuf/metadata"
                PREVIOUS_ARGS=()
                if [ -d "$PREVIOUS" ]; then
                  PREVIOUS_ARGS=(--previous-metadata "$PREVIOUS")
                fi
                node "$GITHUB_WORKSPACE/source/apps/fraia-electron/scripts/sign-tuf-update-repository.cjs" \
                  --root "$ROOT" \
                  --target "$FEED/$TARGET_NAME" \
                  --target-name "$TARGET_NAME" \
                  --output "$FEED/tuf" \
                  "${PREVIOUS_ARGS[@]}"
                (cd "$FEED/tuf" && sha256sum --check --strict SHA256SUMS)
              done
            done
          done

      - name: Upload sealed updater feeds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-update-feeds-sealed
          path: publish/feed
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ needs.prepare.outputs.channel }} release and eligible feeds
    if: >-
      ${{
        always()
        && needs.prepare.result == 'success'
        && needs.prepare.outputs.simulation != 'true'
        && needs.seal-tuf.result == 'success'
        && needs.attest.result == 'success'
      }}
    needs: [prepare, seal-tuf, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-release-assets
          path: publish/assets

      - name: Download sealed updater feeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-update-feeds-sealed
          path: publish/feed

      - name: Create or byte-verify exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPOSITORY="${{ github.repository }}"
          node source/apps/fraia-electron/scripts/release-assets.cjs \
            --channels "${{ needs.prepare.outputs.channels_csv }}" \
            --output /tmp/reassembled-assets \
            --allow-auxiliary-asset homebrew-publication.tar.gz \
            --input publish/assets > expected-assets.txt
          rm -rf /tmp/reassembled-assets
          if [ "${{ needs.prepare.outputs.channel }}" = beta ]; then
            TITLE="Fraia Beta ${{ needs.prepare.outputs.version }}"
          else
            TITLE="Fraia ${{ needs.prepare.outputs.version }}"
          fi
          node source/apps/fraia-electron/scripts/changelog.cjs \
            --changelog source/CHANGELOG.md \
            --version "${{ needs.prepare.outputs.version }}" \
            --output release-notes.md
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "$TITLE" --notes-file release-notes.md --draft
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)
          EXPECTED_BODY=$(cat release-notes.md)
          EXISTING_BODY=$(gh release view "$TAG" --repo "$REPOSITORY" --json body --jq .body)
          if [ "$EXISTING_BODY" != "$EXPECTED_BODY" ]; then
            if [ "$IS_DRAFT" = true ]; then
              gh release edit "$TAG" --repo "$REPOSITORY" --notes-file release-notes.md
            else
              echo 'Published release notes differ from CHANGELOG.md; refusing to mutate the published release.' >&2
              exit 1
            fi
          fi
          gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > existing-assets.txt
          comm -23 existing-assets.txt expected-assets.txt > unexpected-assets.txt
          if [ -s unexpected-assets.txt ]; then echo 'Release contains unexpected assets:' >&2; cat unexpected-assets.txt >&2; exit 1; fi
          mkdir -p existing-release
          if [ -s existing-assets.txt ]; then
            gh release download "$TAG" --repo "$REPOSITORY" --dir existing-release
            while IFS= read -r name; do cmp "publish/assets/$name" "existing-release/$name"; done < existing-assets.txt
          fi
          if [ "$IS_DRAFT" = true ]; then
            comm -13 existing-assets.txt expected-assets.txt > missing-assets.txt
            while IFS= read -r name; do gh release upload "$TAG" "publish/assets/$name" --repo "$REPOSITORY"; done < missing-assets.txt
          elif ! diff -q existing-assets.txt expected-assets.txt; then
            echo 'Published release asset contract differs; refusing to replace assets automatically.' >&2
            exit 1
          fi
          rm -rf downloaded-release
          mkdir downloaded-release
          gh release download "$TAG" --repo "$REPOSITORY" --dir downloaded-release
          find downloaded-release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-assets.txt
          diff --unified expected-assets.txt actual-assets.txt
          (cd downloaded-release && sha256sum --check --strict SHA256SUMS)

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.channel }}" = beta ]; then
            TITLE="Fraia Beta ${{ needs.prepare.outputs.version }}"
            RELEASE_TYPE=(--prerelease --latest=false)
          else
            TITLE="Fraia ${{ needs.prepare.outputs.version }}"
            RELEASE_TYPE=(--prerelease=false --latest)
          fi
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "$TITLE" --notes-file release-notes.md --draft=false "${RELEASE_TYPE[@]}"

      - name: Verify public release before sealing updater feed
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          TAG="${{ github.ref_name }}"
          REPOSITORY="${{ github.repository }}"
          RELEASE_BASE="https://github.com/$REPOSITORY/releases/download/$TAG"
          API_URL="https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG"
          EXPECTED_PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$API_URL" -o public-release.json \
              && [ "$(jq -r '.draft' public-release.json)" = false ] \
              && [ "$(jq -r '.prerelease' public-release.json)" = "$EXPECTED_PRERELEASE" ] \
              && [ "$(jq -r '.body' public-release.json)" = "$(cat release-notes.md)" ]; then
              jq -r '.assets[].name' public-release.json | LC_ALL=C sort > public-assets.txt
              if diff --unified expected-assets.txt public-assets.txt; then break; fi
            fi
            if [ "$attempt" = 12 ]; then
              echo 'Public release did not converge to the exact asset contract.' >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$RELEASE_BASE/SHA256SUMS" -o public-SHA256SUMS
          mapfile -t public_checksums < public-SHA256SUMS
          for checksum_line in "${public_checksums[@]}"; do
            checksum="${checksum_line%% *}"
            filename="${checksum_line#*  }"
            curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$RELEASE_BASE/$filename" -o "public-$filename"
            printf '%s  %s\n' "$checksum" "public-$filename" | sha256sum --check --strict -
          done

      - name: Prepare sealed updater-feed publication bundle
        shell: bash
        run: |
          set -euo pipefail
          IFS=, read -r -a CHANNELS <<< "${{ needs.prepare.outputs.channels_csv }}"
          rm -rf feed-publication
          mkdir -p feed-publication
          touch feed-publication/.nojekyll
          for CHANNEL in "${CHANNELS[@]}"; do
            mkdir -p "feed-publication/feed/$CHANNEL"
            cp -R "publish/feed/$CHANNEL/." "feed-publication/feed/$CHANNEL/"
            {
              printf 'Fraia updater-feed publication bundle\n'
              printf 'Channel: %s\n' "$CHANNEL"
              printf 'Tag: %s\n' "${{ github.ref_name }}"
              printf 'Commit: %s\n' "${{ github.sha }}"
              printf 'Destination: updates branch / %s\n' "$CHANNEL"
              printf 'Publication: owner-authorized tag workflow by %s\n' "${{ github.actor }}"
            } > "feed-publication/PUBLICATION-$CHANNEL.txt"
          done
          (
            cd feed-publication
            checksum_file="$(mktemp)"
            trap 'rm -f "$checksum_file"' EXIT
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
            trap - EXIT
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload sealed updater-feed publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraia-update-feed-publication-${{ github.ref_name }}
          path: feed-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Checkout the seeded updater-feed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: update-site
          ref: updates

      - name: Publish only the eligible updater channels atomically
        shell: bash
        run: |
          set -euo pipefail
          IFS=, read -r -a CHANNELS <<< "${{ needs.prepare.outputs.channels_csv }}"
          PATHS=(.nojekyll)
          cp feed-publication/.nojekyll update-site/
          for CHANNEL in "${CHANNELS[@]}"; do
            rm -rf "update-site/$CHANNEL"
            mkdir -p "update-site/$CHANNEL"
            cp -R "feed-publication/feed/$CHANNEL/." "update-site/$CHANNEL/"
            cp "feed-publication/PUBLICATION-$CHANNEL.txt" update-site/
            diff --recursive "feed-publication/feed/$CHANNEL" "update-site/$CHANNEL"
            PATHS+=("PUBLICATION-$CHANNEL.txt" "$CHANNEL")
          done
          (
            cd update-site
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- "${PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "Publish Fraia ${{ needs.prepare.outputs.version }} ${{ needs.prepare.outputs.channels_csv }} feeds"
              git push origin HEAD:updates
            fi
          )

  verify-publication:
    name: Verify public release and feeds
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Download expected sealed updater feeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-update-feeds-sealed
          path: expected/feed

      - name: Download sealed updater-feed publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fraia-update-feed-publication-${{ github.ref_name }}
          path: feed-publication

      - name: Verify unauthenticated assets and sealed feed bundle
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          mkdir -p public
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$RELEASE_BASE/SHA256SUMS" -o public/SHA256SUMS
          mapfile -t public_checksums < public/SHA256SUMS
          for checksum_line in "${public_checksums[@]}"; do
            checksum="${checksum_line%% *}"
            filename="${checksum_line#*  }"
            curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$RELEASE_BASE/$filename" -o "public/$filename"
            printf '%s  %s\n' "$checksum" "public/$filename" | sha256sum --check --strict -
          done
          (cd feed-publication && sha256sum --check --strict SHA256SUMS)
          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/updates"
          for attempt in {1..12}; do
            complete=true
            while IFS= read -r expected_feed; do
              relative="${expected_feed#expected/feed/}"
              destination="public-feed/${relative}"
              mkdir -p "$(dirname "$destination")"
              if ! curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$RAW_BASE/$relative" -o "$destination" \
                || ! cmp "$expected_feed" "$destination"; then
                complete=false
              fi
            done < <(find expected/feed -type f | LC_ALL=C sort)
            if [ "$complete" = true ]; then break; fi
            if [ "$attempt" = 12 ]; then
              echo 'Public updater feed did not converge to the exact channel projection.' >&2
              exit 1
            fi
            sleep 5
          done
          while IFS= read -r expected_feed; do
            relative="${expected_feed#expected/feed/}"
            cmp "$expected_feed" "feed-publication/feed/$relative"
          done < <(find expected/feed -type f | LC_ALL=C sort)

  homebrew-native-validation:
    name: Homebrew ${{ matrix.channel }} (${{ matrix.architecture }})
    needs: [prepare, verify-publication]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.prepare.outputs.channels) }}
        architecture: [arm64, x64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    steps:
      - name: Download and verify the attested publication bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rm -f homebrew-publication.tar.gz
            if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern homebrew-publication.tar.gz &&
              gh attestation verify homebrew-publication.tar.gz --repo "${{ github.repository }}"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Public bundle download or attestation verification failed after $attempt attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          mkdir publication
          tar -xzf homebrew-publication.tar.gz -C publication
          (cd publication && shasum -a 256 -c SHA256SUMS)
      - name: Install and launch the exact release through Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          run_with_timeout() {
            local timeout_seconds="$1"
            shift
            python3 - "$timeout_seconds" "$@" <<'PY'
          import subprocess
          import sys
          try:
              completed = subprocess.run(sys.argv[2:], timeout=int(sys.argv[1]), check=False)
          except subprocess.TimeoutExpired:
              print(f"Command timed out after {sys.argv[1]} seconds: {' '.join(sys.argv[2:])}", file=sys.stderr)
              raise SystemExit(124)
          raise SystemExit(completed.returncode)
          PY
          }
          cask_name="${{ matrix.channel == 'stable' && 'fraia.rb' || 'fraia@beta.rb' }}"
          application="${{ matrix.channel == 'stable' && 'Fraia.app' || 'Fraia Beta.app' }}"
          tap_root="$(brew --repository)/Library/Taps/fraia-validation/homebrew-release"
          token="fraia-validation/release/${cask_name%.rb}"
          cleanup() {
            pkill -f "/Applications/$application/Contents/MacOS/" || true
            run_with_timeout 120 brew uninstall --cask "$token" || true
            rm -rf "$(brew --repository)/Library/Taps/fraia-validation"
          }
          trap cleanup EXIT
          mkdir -p "$tap_root/Casks"
          cp "$PWD/publication/Casks/$cask_name" "$tap_root/Casks/$cask_name"
          echo "Installing $token with a 12-minute limit."
          run_with_timeout 720 brew install --verbose --cask "$token"
          app="/Applications/$application"
          test -d "$app"
          echo "Launching $app."
          run_with_timeout 30 open -n "$app"
          for _ in {1..30}; do pgrep -f "$app/Contents/MacOS/" >/dev/null && break; sleep 1; done
          pgrep -f "$app/Contents/MacOS/" >/dev/null
          echo "$application launched successfully."

  dispatch-homebrew-publication:
    name: Dispatch and await tap-owned Homebrew publication
    needs: [prepare, homebrew-native-validation]
    runs-on: ubuntu-24.04
    environment: homebrew-dispatch
    permissions:
      contents: read
    steps:
      - name: Mint dispatch-only tap token
        id: dispatcher
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2
        with:
          app-id: ${{ vars.HOMEBREW_DISPATCHER_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_DISPATCHER_PRIVATE_KEY }}
          owner: apotenza92
          repositories: homebrew-tap
          permission-contents: write
          permission-actions: read
      - name: Dispatch trusted publication and wait for exact correlation
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          TAP_REPOSITORY: apotenza92/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          correlation="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_REF_NAME}"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg product fraia --arg tag "$GITHUB_REF_NAME" --arg release_commit "$GITHUB_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$correlation" \
            '{event_type:"publish-homebrew-v1",client_payload:{product:$product,tag:$tag,release_commit:$release_commit,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,correlation_id:$correlation_id}}' |
            gh api --method POST "repos/$TAP_REPOSITORY/dispatches" --input -
          run_id=''
          for _ in {1..30}; do
            run_id="$(gh api "repos/$TAP_REPOSITORY/actions/workflows/publish-homebrew.yml/runs?event=repository_dispatch&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title == \"$correlation\" and .created_at >= \"$started\") | .id" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          gh run watch "$run_id" --repo "$TAP_REPOSITORY" --exit-status

  simulation-complete:
    name: Report non-publishing release simulation
    if: ${{ always() && needs.prepare.outputs.simulation == 'true' && needs.package-windows.result == 'success' && needs.package-linux.result == 'success' }}
    needs: [prepare, package-windows, package-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm publication boundary
        run: |
          test "${{ needs.prepare.outputs.simulation }}" = true
          echo "Built and qualified Fraia ${{ needs.prepare.outputs.version }} Windows and Linux candidates without publication."
