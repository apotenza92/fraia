[workspace]
members = [
  "crates/fraia-math",
  "crates/fraia-geometry",
  "crates/fraia-physics",
  "crates/fraia-core",
  "crates/fraia-app-api",
  "apps/fraia-cli",
  "apps/fraia-appd",
]
resolver = "2"

[workspace.package]
version = "0.0.11"
edition = "2024"
license = "MIT"
authors = ["Alex"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
