releaseNotes: "### Changed\r

  \r

  - The updater-feed publication stage now creates its sealed staging directory\r

  \  before writing and checksumming the feed projection. A deterministic release\r

  \  workflow test protects that ordering.\r

  \r

  ### Updating\r

  \r

  - Stable and Beta installations on the `0.0.4` feeds update directly to their\r

  \  separately packaged `0.0.6` identities. The public `0.0.5` GitHub release\r

  \  remains available for direct download, but its updater-feed projection did\r

  \  not publish after the release assets were made public."
