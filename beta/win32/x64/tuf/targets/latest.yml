releaseName: Fraia Beta 0.0.9
releaseNotes: "### Changed\r

  \r

  - Base Model and Design Options conversations now share a cleaner transcript\r

  \  with consistent assistant, user, streaming, and progress presentation.\r

  - Fraia now follows the system appearance and clears stale manual theme\r

  \  overrides.\r

  - The Fraia menu now exposes the automatic update schedule directly and keeps\r

  \  menu items wide enough for their labels.\r

  - Workflow stages are navigated directly from their labels, with unavailable\r

  \  stages explaining what is needed to continue.\r

  - Error and destructive-alert text now meets WCAG AA contrast in the light\r

  \  appearance, with the release desktop test pinned to that appearance.\r

  - The public download page now provides platform-aware Stable and Beta\r

  \  downloads, checksums, provenance, and unsigned-package disclosures.\r

  - Stable and Beta now use a clearer low-poly Ionic column icon with a shorter,\r

  \  more legible silhouette and distinct solid channel backgrounds.\r

  - macOS uses matching light and dark artwork, while Windows and Linux retain\r

  \  the reviewed light variants at every generated application-icon size.\r

  \r

  ### Updating\r

  \r

  - Stable and Beta installations update to separately packaged `0.0.9`\r

  \  application identities on their existing channels."
