releaseNotes: "### Changed\r

  \r

  - Stable and beta are now separate, side-by-side applications with isolated\r

  \  application ids, package names, user-data directories, artifacts, update\r

  \  feeds, and release tags. Stable uses `vX.Y.Z`; beta uses\r

  \  `vX.Y.Z-beta.N` and is published as a GitHub prerelease.\r

  - CalculiX corresponding source now uses GNU's canonical GCC archive endpoint\r

  \  while retaining the reviewed GCC 16.1.0 SHA-256.\r

  \r

  ### Updating\r

  \r

  - Each identity accepts updates only from its own channel. Stable releases no\r

  \  longer overwrite the beta feed, and beta releases cannot replace stable\r

  \  installations or their settings and projects."
